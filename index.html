<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Whiskers' Meadow</title>
  <meta name="description" content="A little white cat wanders a hand-made, low-poly meadow." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hint">drag to look around &middot; scroll to zoom</div>
  <div id="title">
    <h1>Whiskers&rsquo; Meadow</h1>
    <p>a little cat, a lot of flowers</p>
  </div>
  <div id="sky-toggle" role="group" aria-label="Time of day">
    <button type="button" data-sky="day" title="Day"><span class="icon">☀️</span><span class="label">Day</span></button>
    <button type="button" data-sky="night" title="Night"><span class="icon">🌙</span><span class="label">Night</span></button>
  </div>
  <div id="loading">
    <div class="paw">🐾</div>
    <div>waking the cat up&hellip;</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
